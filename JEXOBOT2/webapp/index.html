<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo Casino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1420);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #8e97a8);
    --button: var(--tg-theme-button-color, #4f7cff);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #1a2033);
    --accent-green: #2fbf71;
    --accent-red: #ff5b5b;
    --accent-gold: #f0b429;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app { max-width: 480px; margin: 0 auto; padding: 16px; }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border-radius: 16px; padding: 14px 18px; margin-bottom: 16px;
  }
  .balance-label { font-size: 12px; color: var(--hint); }
  .balance-value { font-size: 22px; font-weight: 700; color: var(--accent-gold); }
  .bonus-btn {
    background: var(--accent-green); color: #fff; border: none; border-radius: 10px;
    padding: 8px 14px; font-size: 14px; font-weight: 600;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .game-card {
    background: var(--card); border-radius: 16px; padding: 18px; text-align: center;
    cursor: pointer; border: none; color: var(--text); font-size: 16px; font-weight: 600;
  }
  .game-card .emoji { font-size: 32px; display: block; margin-bottom: 8px; }
  .game-card:active { opacity: 0.7; }

  .screen { display: none; }
  .screen.active { display: block; }

  .back-btn {
    background: none; border: none; color: var(--hint); font-size: 15px; margin-bottom: 12px;
    padding: 4px 0;
  }

  .panel {
    background: var(--card); border-radius: 16px; padding: 20px; text-align: center;
  }
  .reels {
    font-size: 40px; letter-spacing: 8px; margin: 20px 0; min-height: 50px;
  }
  .result-text { font-size: 17px; font-weight: 700; margin: 14px 0; min-height: 24px; }
  .result-text.win { color: var(--accent-green); }
  .result-text.lose { color: var(--accent-red); }

  .stake-row { display: flex; gap: 8px; justify-content: center; margin: 16px 0; flex-wrap: wrap; }
  .stake-btn, .choice-btn {
    background: var(--button); color: var(--button-text); border: none; border-radius: 10px;
    padding: 12px 18px; font-size: 15px; font-weight: 600; min-width: 56px;
  }
  .choice-row { display: flex; gap: 10px; justify-content: center; margin: 16px 0; flex-wrap: wrap; }
  .choice-btn.red { background: var(--accent-red); }
  .choice-btn.black { background: #333; }

  .cards-row { font-size: 30px; letter-spacing: 6px; margin: 10px 0; }
  .value-label { color: var(--hint); font-size: 14px; }

  .leaderboard-item {
    display: flex; justify-content: space-between; padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .leaderboard-item:last-child { border-bottom: none; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--card); padding: 10px 18px; border-radius: 10px; font-size: 14px;
    display: none; z-index: 10;
  }
</style>
</head>
<body>
<div id="app">

  <div class="header">
    <div>
      <div class="balance-label">Баланс</div>
      <div class="balance-value" id="balanceValue">—</div>
    </div>
    <button class="bonus-btn" onclick="claimBonus()">🎁 Бонус</button>
  </div>

  <!-- ГЛАВНОЕ МЕНЮ -->
  <div class="screen active" id="screen-menu">
    <div class="grid">
      <button class="game-card" onclick="showScreen('slots')"><span class="emoji">🎰</span>Слоты</button>
      <button class="game-card" onclick="showScreen('roulette')"><span class="emoji">🎡</span>Рулетка</button>
      <button class="game-card" onclick="showScreen('dice')"><span class="emoji">🎲</span>Кости</button>
      <button class="game-card" onclick="showScreen('blackjack')"><span class="emoji">🃏</span>Блэкджек</button>
      <button class="game-card" onclick="loadLeaderboard()" style="grid-column: span 2;"><span class="emoji">🏆</span>Топ игроков</button>
    </div>
  </div>

  <!-- СЛОТЫ -->
  <div class="screen" id="screen-slots">
    <button class="back-btn" onclick="showScreen('menu')">← Назад</button>
    <div class="panel">
      <h3>🎰 Слоты</h3>
      <div class="reels" id="slotsReels">[ ❔ | ❔ | ❔ ]</div>
      <div class="result-text" id="slotsResult"></div>
      <div class="stake-row" id="slotsStakes"></div>
    </div>
  </div>

  <!-- РУЛЕТКА -->
  <div class="screen" id="screen-roulette">
    <button class="back-btn" onclick="showScreen('menu')">← Назад</button>
    <div class="panel">
      <h3>🎡 Рулетка</h3>
      <p class="value-label">Ставка 100 монет</p>
      <div class="result-text" id="rouletteResult"></div>
      <div class="choice-row">
        <button class="choice-btn red" onclick="playRoulette('red')">🔴 Красное</button>
        <button class="choice-btn black" onclick="playRoulette('black')">⚫ Чёрное</button>
      </div>
    </div>
  </div>

  <!-- КОСТИ -->
  <div class="screen" id="screen-dice">
    <button class="back-btn" onclick="showScreen('menu')">← Назад</button>
    <div class="panel">
      <h3>🎲 Кости</h3>
      <p class="value-label">Ставка 50 монет · угадай число (x5)</p>
      <div class="result-text" id="diceResult"></div>
      <div class="choice-row" id="diceChoices"></div>
    </div>
  </div>

  <!-- БЛЭКДЖЕК -->
  <div class="screen" id="screen-blackjack">
    <button class="back-btn" onclick="showScreen('menu')">← Назад</button>
    <div class="panel">
      <h3>🃏 Блэкджек</h3>
      <div id="bjStakeChoice">
        <p class="value-label">Выбери ставку</p>
        <div class="stake-row" id="bjStakes"></div>
      </div>
      <div id="bjGame" style="display:none;">
        <p class="value-label">Дилер</p>
        <div class="cards-row" id="bjDealerCards"></div>
        <p class="value-label">Твои карты</p>
        <div class="cards-row" id="bjPlayerCards"></div>
        <div class="value-label" id="bjPlayerValue"></div>
        <div class="result-text" id="bjResult"></div>
        <div class="choice-row" id="bjActions">
          <button class="choice-btn" onclick="bjHit()">➕ Ещё карту</button>
          <button class="choice-btn" onclick="bjStand()">✋ Хватит</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ТОП ИГРОКОВ -->
  <div class="screen" id="screen-leaderboard">
    <button class="back-btn" onclick="showScreen('menu')">← Назад</button>
    <div class="panel">
      <h3>🏆 Топ игроков</h3>
      <div id="leaderboardList"></div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const initData = tg.initData || "";
const STAKES = [10, 50, 100, 500];

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2200);
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

async function apiGet(path) {
  const res = await fetch(path);
  return res.json();
}
async function apiPost(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return res.json();
}

async function refreshBalance() {
  const data = await apiGet('/api/me?initData=' + encodeURIComponent(initData));
  if (data.balance !== undefined) {
    document.getElementById('balanceValue').textContent = data.balance;
  }
}

async function claimBonus() {
  const data = await apiPost('/api/bonus', { initData });
  if (data.success) {
    showToast('🎁 Бонус получен!');
    refreshBalance();
  } else {
    const h = Math.floor(data.seconds_left / 3600);
    const m = Math.floor((data.seconds_left % 3600) / 60);
    showToast(`Бонус уже получен. Жди ${h}ч ${m}м`);
  }
}

// ---------- Слоты ----------
function initSlots() {
  const row = document.getElementById('slotsStakes');
  row.innerHTML = '';
  STAKES.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'stake-btn';
    btn.textContent = s;
    btn.onclick = () => playSlots(s);
    row.appendChild(btn);
  });
}
async function playSlots(stake) {
  const data = await apiPost('/api/slots', { initData, stake });
  if (data.error) { showToast('Недостаточно монет'); return; }
  document.getElementById('slotsReels').textContent = `[ ${data.reels.join(' | ')} ]`;
  const net = data.payout - stake;
  const el = document.getElementById('slotsResult');
  el.textContent = net > 0 ? `🎉 Выигрыш: +${net}` : `Проигрыш: ${net}`;
  el.className = 'result-text ' + (net > 0 ? 'win' : 'lose');
  document.getElementById('balanceValue').textContent = data.balance;
}

// ---------- Рулетка ----------
async function playRoulette(color) {
  const data = await apiPost('/api/roulette', { initData, stake: 100, bet_type: 'color', bet_value: color });
  if (data.error) { showToast('Недостаточно монет'); return; }
  const net = data.payout - 100;
  const emoji = { red: '🔴', black: '⚫', green: '🟢' }[data.color];
  const el = document.getElementById('rouletteResult');
  el.textContent = `Выпало ${data.number} ${emoji} — ` + (net > 0 ? `+${net}` : `${net}`);
  el.className = 'result-text ' + (net > 0 ? 'win' : 'lose');
  document.getElementById('balanceValue').textContent = data.balance;
}

// ---------- Кости ----------
function initDice() {
  const row = document.getElementById('diceChoices');
  row.innerHTML = '';
  for (let n = 1; n <= 6; n++) {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = n;
    btn.onclick = () => playDice(n);
    row.appendChild(btn);
  }
}
async function playDice(guess) {
  const data = await apiPost('/api/dice', { initData, stake: 50, guess });
  if (data.error) { showToast('Недостаточно монет'); return; }
  const net = data.payout - 50;
  const el = document.getElementById('diceResult');
  el.textContent = `Выпало ${data.result} — ` + (net > 0 ? `+${net}` : `${net}`);
  el.className = 'result-text ' + (net > 0 ? 'win' : 'lose');
  document.getElementById('balanceValue').textContent = data.balance;
}

// ---------- Блэкджек ----------
function initBlackjack() {
  document.getElementById('bjStakeChoice').style.display = 'block';
  document.getElementById('bjGame').style.display = 'none';
  const row = document.getElementById('bjStakes');
  row.innerHTML = '';
  STAKES.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'stake-btn';
    btn.textContent = s;
    btn.onclick = () => bjStart(s);
    row.appendChild(btn);
  });
}
async function bjStart(stake) {
  const data = await apiPost('/api/blackjack/start', { initData, stake });
  if (data.error) { showToast('Недостаточно монет'); return; }
  document.getElementById('bjStakeChoice').style.display = 'none';
  document.getElementById('bjGame').style.display = 'block';
  document.getElementById('bjResult').textContent = '';
  document.getElementById('bjActions').style.display = 'flex';
  renderBjState(data.player, [data.dealer_visible, '🂠'], data.player_value, null);
}
function renderBjState(player, dealer, playerValue, dealerLabel) {
  document.getElementById('bjPlayerCards').textContent = player.join(' ');
  document.getElementById('bjDealerCards').textContent = dealer.join(' ');
  document.getElementById('bjPlayerValue').textContent = `Очки: ${playerValue}`;
}
async function bjHit() {
  const data = await apiPost('/api/blackjack/hit', { initData });
  if (data.finished) { bjFinish(data); return; }
  renderBjState(data.player, [data.dealer_visible, '🂠'], data.player_value);
}
async function bjStand() {
  const data = await apiPost('/api/blackjack/stand', { initData });
  bjFinish(data);
}
function bjFinish(data) {
  renderBjState(data.player, data.dealer, data.player ? data.player.length : 0, null);
  document.getElementById('bjPlayerValue').textContent = '';
  document.getElementById('bjActions').style.display = 'none';
  const messages = {
    bust: '💥 Перебор! Ты проиграл.',
    dealer_bust: `🎉 У дилера перебор! Выигрыш +${data.payout - 0}`,
    win: `🎉 Ты выиграл!`,
    push: '🤝 Ничья, ставка возвращена.',
    lose: 'Ты проиграл.',
  };
  const el = document.getElementById('bjResult');
  el.textContent = messages[data.outcome] || '';
  el.className = 'result-text ' + (['win', 'dealer_bust'].includes(data.outcome) ? 'win' : 'lose');
  document.getElementById('balanceValue').textContent = data.balance;
  const btn = document.createElement('button');
  btn.className = 'choice-btn';
  btn.textContent = '🃏 Играть ещё';
  btn.onclick = initBlackjack;
  document.getElementById('bjActions').innerHTML = '';
  document.getElementById('bjActions').appendChild(btn);
  document.getElementById('bjActions').style.display = 'flex';
}

// ---------- Таблица лидеров ----------
async function loadLeaderboard() {
  showScreen('leaderboard');
  const rows = await apiGet('/api/leaderboard');
  const list = document.getElementById('leaderboardList');
  list.innerHTML = rows.map((r, i) =>
    `<div class="leaderboard-item"><span>${i + 1}. ${r.username || 'аноним'}</span><span>${r.balance}</span></div>`
  ).join('');
}

// ---------- Инициализация ----------
initSlots();
initDice();
initBlackjack();
refreshBalance();
</script>
</body>
</html>
