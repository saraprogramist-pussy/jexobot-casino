<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo Casino</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0a0e1a);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #8e97a8);
    --button: var(--tg-theme-button-color, #7c5cff);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #161c2e);
    --accent-purple: #7c5cff;
    --accent-green: #2fe89a;
    --accent-red: #ff4d6d;
    --accent-gold: #ffc247;
    --accent-blue: #4fb6ff;
    --glow-purple: 0 0 24px rgba(124, 92, 255, 0.45);
    --glow-green: 0 0 24px rgba(47, 232, 154, 0.45);
    --glow-gold: 0 0 24px rgba(255, 194, 71, 0.4);
    --glow-red: 0 0 24px rgba(255, 77, 109, 0.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(circle at top, #1a2140 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    overflow-x: hidden;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 16px; }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(135deg, rgba(124,92,255,0.18), rgba(22,28,46,0.9));
    border: 1px solid rgba(124,92,255,0.25);
    border-radius: 18px; padding: 14px 18px; margin-bottom: 18px;
    backdrop-filter: blur(10px);
  }
  .balance-label { font-size: 12px; color: var(--hint); letter-spacing: 0.04em; text-transform: uppercase; }
  .balance-value { font-size: 24px; font-weight: 800; color: var(--accent-gold); text-shadow: var(--glow-gold); transition: transform 0.25s; }
  .balance-value.bump { transform: scale(1.15); }
  .bonus-btn {
    background: linear-gradient(135deg, var(--accent-green), #1fa876);
    color: #042; border: none; border-radius: 12px;
    padding: 10px 16px; font-size: 14px; font-weight: 700;
    box-shadow: var(--glow-green);
  }
  .bonus-btn:active { transform: scale(0.96); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .game-card {
    position: relative; overflow: hidden;
    background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01)), var(--card);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px; padding: 20px 14px; text-align: center;
    cursor: pointer; color: var(--text); font-size: 15px; font-weight: 700;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .game-card:active { transform: scale(0.95); }
  .game-card .emoji { font-size: 34px; display: block; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.25)); }
  .game-card.purple { box-shadow: 0 0 0 rgba(0,0,0,0); }
  .game-card.purple:active { box-shadow: var(--glow-purple); }
  .game-card.green:active { box-shadow: var(--glow-green); }
  .game-card.gold:active { box-shadow: var(--glow-gold); }
  .game-card.red:active { box-shadow: var(--glow-red); }
  .game-card .tag {
    position: absolute; top: 8px; right: 8px; font-size: 9px; font-weight: 800;
    background: var(--accent-red); color: #fff; padding: 2px 6px; border-radius: 6px;
    text-transform: uppercase; letter-spacing: 0.03em;
  }

  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .back-btn {
    background: none; border: none; color: var(--hint); font-size: 15px; margin-bottom: 12px;
    padding: 4px 0; font-weight: 600;
  }

  .panel {
    background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)), var(--card);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px; padding: 22px; text-align: center;
  }
  .panel h3 { margin-top: 0; font-size: 19px; }

  /* ---- Слоты ---- */
  .reels { display: flex; justify-content: center; gap: 10px; margin: 22px 0; }
  .reel {
    width: 64px; height: 64px; background: rgba(0,0,0,0.35); border-radius: 14px;
    display: flex; align-items: center; justify-content: center; font-size: 34px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .reel.spinning { animation: reelSpin 0.12s linear infinite; }
  @keyframes reelSpin { 0% { transform: translateY(-4px); } 50% { transform: translateY(4px); } 100% { transform: translateY(-4px); } }

  .result-text { font-size: 17px; font-weight: 800; margin: 14px 0; min-height: 24px; }
  .result-text.win { color: var(--accent-green); text-shadow: var(--glow-green); }
  .result-text.lose { color: var(--accent-red); }

  .stake-row { display: flex; gap: 8px; justify-content: center; margin: 16px 0; flex-wrap: wrap; }
  .stake-btn, .choice-btn {
    background: linear-gradient(135deg, var(--button), #5b3fd9); color: var(--button-text); border: none; border-radius: 12px;
    padding: 12px 18px; font-size: 15px; font-weight: 700; min-width: 56px;
    box-shadow: 0 4px 14px rgba(124,92,255,0.3);
  }
  .stake-btn:active, .choice-btn:active { transform: scale(0.94); }
  .choice-row { display: flex; gap: 10px; justify-content: center; margin: 16px 0; flex-wrap: wrap; }
  .choice-btn.red { background: linear-gradient(135deg, var(--accent-red), #b8243f); }
  .choice-btn.black { background: linear-gradient(135deg, #2a2a35, #121218); }
  .choice-btn.disabled { opacity: 0.4; pointer-events: none; }

  /* ---- Рулетка ---- */
  .wheel-wrap { display: flex; justify-content: center; margin: 10px 0 20px; }
  .wheel {
    width: 160px; height: 160px; border-radius: 50%;
    background: conic-gradient(#b8243f 0deg 18deg, #121218 18deg 36deg, #b8243f 36deg 54deg, #121218 54deg 72deg,
      #b8243f 72deg 90deg, #121218 90deg 108deg, #b8243f 108deg 126deg, #121218 126deg 144deg,
      #b8243f 144deg 162deg, #121218 162deg 180deg, #1fa876 180deg 190deg, #b8243f 190deg 208deg,
      #121218 208deg 226deg, #b8243f 226deg 244deg, #121218 244deg 262deg, #b8243f 262deg 280deg,
      #121218 280deg 298deg, #b8243f 298deg 316deg, #121218 316deg 334deg, #b8243f 334deg 360deg);
    border: 4px solid rgba(255,255,255,0.15);
    position: relative; transition: transform 2.2s cubic-bezier(0.17, 0.67, 0.18, 1.01);
  }
  .wheel::after {
    content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 46px; height: 46px; border-radius: 50%; background: var(--card); border: 2px solid rgba(255,255,255,0.2);
  }
  .wheel-pointer { font-size: 22px; margin-top: -8px; }

  /* ---- Кости ---- */
  .die {
    width: 90px; height: 90px; margin: 20px auto; display: flex; align-items: center; justify-content: center;
    font-size: 54px; background: linear-gradient(160deg, rgba(255,255,255,0.1), rgba(0,0,0,0.3));
    border-radius: 18px; border: 1px solid rgba(255,255,255,0.15);
  }
  .die.rolling { animation: dieRoll 0.5s ease; }
  @keyframes dieRoll { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.15); } 100% { transform: rotate(360deg) scale(1); } }

  /* ---- Блэкджек ---- */
  .cards-row { display: flex; justify-content: center; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .card-chip {
    background: #fff; color: #111; border-radius: 10px; padding: 10px 6px; min-width: 38px;
    font-size: 20px; font-weight: 800; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    animation: cardDeal 0.3s ease;
  }
  @keyframes cardDeal { from { opacity: 0; transform: translateY(-16px) rotate(-8deg); } to { opacity: 1; transform: translateY(0) rotate(0); } }
  .value-label { color: var(--hint); font-size: 14px; }

  /* ---- Mines ---- */
  .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px auto; max-width: 300px; }
  .mine-tile {
    aspect-ratio: 1; background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(0,0,0,0.3));
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    transition: transform 0.15s;
  }
  .mine-tile:active { transform: scale(0.92); }
  .mine-tile.revealed-safe { background: linear-gradient(160deg, rgba(47,232,154,0.3), rgba(47,232,154,0.05)); animation: popIn 0.25s ease; }
  .mine-tile.revealed-mine { background: linear-gradient(160deg, rgba(255,77,109,0.4), rgba(255,77,109,0.1)); animation: shake 0.4s ease; }
  @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .mines-config { display: flex; gap: 8px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
  .mines-multiplier { font-size: 26px; font-weight: 800; color: var(--accent-gold); text-shadow: var(--glow-gold); margin: 10px 0; }

  /* ---- Crash ---- */
  .crash-stage {
    height: 180px; border-radius: 16px; margin: 16px 0; position: relative; overflow: hidden;
    background: linear-gradient(180deg, #1a0f2e, #0a0e1a);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .crash-rocket { font-size: 38px; transition: transform 0.25s linear; transform: translateY(0); }
  .crash-multiplier {
    position: absolute; top: 16px; left: 0; right: 0; text-align: center;
    font-size: 36px; font-weight: 900; color: var(--accent-green); text-shadow: var(--glow-green);
  }
  .crash-multiplier.busted { color: var(--accent-red); text-shadow: var(--glow-red); }

  .leaderboard-item {
    display: flex; justify-content: space-between; padding: 12px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.07); font-size: 15px;
  }
  .leaderboard-item:last-child { border-bottom: none; }
  .leaderboard-item .rank { color: var(--accent-gold); font-weight: 800; margin-right: 8px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--card); padding: 10px 18px; border-radius: 12px; font-size: 14px;
    display: none; z-index: 20; border: 1px solid rgba(255,255,255,0.12);
  }

  .confetti-piece {
    position: fixed; top: -10px; width: 8px; height: 8px; border-radius: 2px; z-index: 30; pointer-events: none;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    to { transform: translateY(100vh) rotate(540deg); opacity: 0; }
  }
</style>
</head>
<body>
<div id="app">

  <div class="header">
    <div>
      <div class="balance-label">Баланс</div>
      <div class="balance-value" id="balanceValue">—</div>
    </div>
    <button class="bonus-btn" onclick="claimBonus()">🎁 Бонус</button>
  </div>

  <!-- ГЛАВНОЕ МЕНЮ -->
  <div class="screen active" id="screen-menu">
    <div class="grid">
      <button class="game-card purple" onclick="showScreen('slots')"><span class="emoji">🎰</span>Слоты</button>
      <button class="game-card red" onclick="showScreen('roulette')"><span class="emoji">🎡</span>Рулетка</button>
      <button class="game-card gold" onclick="showScreen('dice')"><span class="emoji">🎲</span>Кости</button>
      <button class="game-card green" onclick="showScreen('blackjack')"><span class="emoji">🃏</span>Блэкджек</button>
      <button class="game-card red" onclick="showScreen('mines')"><span class="tag">New</span><span class="emoji">💣</span>Mines</button>
      <button class="game-card purple" onclick="showScreen('crash')"><span class="tag">New</span><span class="emoji">🚀</span>Crash</button>
      <button class="game-card gold" onclick="loadLeaderboard()" style="grid-column: span 2;"><span class="emoji">🏆</span>Топ игроков</button>
    </div>
  </div>

  <!-- СЛОТЫ -->
  <div class="screen" id="screen-slots">
    <button class="back-btn" onclick="showScreen('menu')">← Назад</button>
    <div class="panel">
      <h3>🎰 Слоты</h3>
      <div class="reels" id="slotsReels">
        <div class="reel">❔</div><div class="reel">❔</div><div class="reel">❔</div>
      </div>
      <div class="result-text" id="slotsResult"></div>
      <div class="stake-row" id="slotsStakes"></div>
    </div>
  </div>

  <!-- РУЛЕТКА -->
  <div class="screen" id="screen-roulette">
    <button class="back-btn" onclick="showScreen('menu')">← Назад</button>
    <div class="panel">
      <h3>🎡 Рулетка</h3>
      <div class="wheel-pointer">▼</div>
      <div class="wheel-wrap"><div class="wheel" id="rouletteWheel"></div></div>
      <p class="value-label">Ставка 5 000 сум</p>
      <div class="result-text" id="rouletteResult"></div>
      <div class="choice-row" id="rouletteChoices">
        <button class="choice-btn red" onclick="playRoulette('red')">🔴 Красное</button>
        <button class="choice-btn black" onclick="playRoulette('black')">⚫ Чёрное</button>
      </div>
    </div>
  </div>

  <!-- КОСТИ -->
  <div class="screen" id="screen-dice">
    <button class="back-btn" onclick="showScreen('menu')">← Назад</button>
    <div class="panel">
      <h3>🎲 Кости</h3>
      <div class="die" id="dieEl">🎲</div>
      <p class="value-label">Ставка 2 000 сум · угадай число (x5)</p>
      <div class="result-text" id="diceResult"></div>
      <div class="choice-row" id="diceChoices"></div>
    </div>
  </div>

  <!-- БЛЭКДЖЕК -->
  <div class="screen" id="screen-blackjack">
    <button class="back-btn" onclick="showScreen('menu')">← Назад</button>
    <div class="panel">
      <h3>🃏 Блэкджек</h3>
      <div id="bjStakeChoice">
        <p class="value-label">Выбери ставку</p>
        <div class="stake-row" id="bjStakes"></div>
      </div>
      <div id="bjGame" style="display:none;">
        <p class="value-label">Дилер</p>
        <div class="cards-row" id="bjDealerCards"></div>
        <p class="value-label">Твои карты</p>
        <div class="cards-row" id="bjPlayerCards"></div>
        <div class="value-label" id="bjPlayerValue"></div>
        <div class="result-text" id="bjResult"></div>
        <div class="choice-row" id="bjActions">
          <button class="choice-btn" onclick="bjHit()">➕ Ещё карту</button>
          <button class="choice-btn" onclick="bjStand()">✋ Хватит</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MINES -->
  <div class="screen" id="screen-mines">
    <button class="back-btn" onclick="showScreen('menu')">← Назад</button>
    <div class="panel">
      <h3>💣 Mines</h3>
      <div id="minesSetup">
        <p class="value-label">Сколько мин на поле?</p>
        <div class="mines-config" id="minesCountChoice"></div>
        <p class="value-label">Ставка</p>
        <div class="stake-row" id="minesStakes"></div>
      </div>
      <div id="minesGame" style="display:none;">
        <div class="mines-multiplier" id="minesMultiplier">x1.00</div>
        <div class="mines-grid" id="minesGrid"></div>
        <div class="result-text" id="minesResult"></div>
        <button class="choice-btn" id="minesCashoutBtn" onclick="minesCashout()" style="margin-top: 10px;">💰 Забрать выигрыш</button>
      </div>
    </div>
  </div>

  <!-- CRASH -->
  <div class="screen" id="screen-crash">
    <button class="back-btn" onclick="showScreen('menu')">← Назад</button>
    <div class="panel">
      <h3>🚀 Crash</h3>
      <div id="crashSetup">
        <p class="value-label">Ставка</p>
        <div class="stake-row" id="crashStakes"></div>
      </div>
      <div id="crashGame" style="display:none;">
        <div class="crash-stage">
          <div class="crash-multiplier" id="crashMultiplierLabel">x1.00</div>
          <div class="crash-rocket" id="crashRocket">🚀</div>
        </div>
        <div class="result-text" id="crashResult"></div>
        <button class="choice-btn" id="crashCashoutBtn" onclick="crashCashout()">💰 Забрать выигрыш</button>
      </div>
    </div>
  </div>

  <!-- ТОП ИГРОКОВ -->
  <div class="screen" id="screen-leaderboard">
    <button class="back-btn" onclick="showScreen('menu')">← Назад</button>
    <div class="panel">
      <h3>🏆 Топ игроков</h3>
      <div id="leaderboardList"></div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const initData = tg.initData || "";
const STAKES = [1000, 5000, 10000, 50000];
const CUR = 'сум';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2200);
}

function showScreen(name) {
  stopCrashPolling();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

async function apiGet(path) {
  const res = await fetch(path);
  return res.json();
}
async function apiPost(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return res.json();
}

function formatSum(n) {
  return n.toLocaleString('ru-RU') + ' ' + CUR;
}

function bumpBalance(newValue) {
  const el = document.getElementById('balanceValue');
  el.textContent = formatSum(newValue);
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 250);
}

async function refreshBalance() {
  const data = await apiGet('/api/me?initData=' + encodeURIComponent(initData));
  if (data.balance !== undefined) bumpBalance(data.balance);
}

async function claimBonus() {
  const data = await apiPost('/api/bonus', { initData });
  if (data.success) {
    showToast('🎁 Бонус получен!');
    fireConfetti();
    refreshBalance();
  } else {
    const h = Math.floor(data.seconds_left / 3600);
    const m = Math.floor((data.seconds_left % 3600) / 60);
    showToast(`Бонус уже получен. Жди ${h}ч ${m}м`);
  }
}

function fireConfetti() {
  const colors = ['#7c5cff', '#2fe89a', '#ffc247', '#ff4d6d', '#4fb6ff'];
  for (let i = 0; i < 24; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (1.2 + Math.random() * 0.8) + 's';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 2200);
  }
}

// ---------- Слоты ----------
function initSlots() {
  const row = document.getElementById('slotsStakes');
  row.innerHTML = '';
  STAKES.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'stake-btn';
    btn.textContent = s;
    btn.onclick = () => playSlots(s);
    row.appendChild(btn);
  });
}
const SLOT_SYMBOLS_CLIENT = ["🍒", "🍋", "🍇", "🔔", "💎", "7️⃣"];
async function playSlots(stake) {
  const reelEls = document.querySelectorAll('#slotsReels .reel');
  reelEls.forEach(r => r.classList.add('spinning'));
  const spinInterval = setInterval(() => {
    reelEls.forEach(r => r.textContent = SLOT_SYMBOLS_CLIENT[Math.floor(Math.random() * SLOT_SYMBOLS_CLIENT.length)]);
  }, 70);

  const data = await apiPost('/api/slots', { initData, stake });
  await new Promise(r => setTimeout(r, 550));
  clearInterval(spinInterval);
  reelEls.forEach(r => r.classList.remove('spinning'));

  if (data.error) { showToast('Недостаточно сум'); return; }
  data.reels.forEach((sym, i) => reelEls[i].textContent = sym);
  const net = data.payout - stake;
  const el = document.getElementById('slotsResult');
  el.textContent = net > 0 ? `🎉 Выигрыш: +${net} ${CUR}` : `Проигрыш: ${net} ${CUR}`;
  el.className = 'result-text ' + (net > 0 ? 'win' : 'lose');
  if (net > 0) fireConfetti();
  bumpBalance(data.balance);
}

// ---------- Рулетка ----------
let rouletteRotation = 0;
async function playRoulette(color) {
  document.getElementById('rouletteChoices').querySelectorAll('.choice-btn').forEach(b => b.classList.add('disabled'));
  const data = await apiPost('/api/roulette', { initData, stake: 5000, bet_type: 'color', bet_value: color });
  if (data.error) {
    showToast('Недостаточно сум');
    document.getElementById('rouletteChoices').querySelectorAll('.choice-btn').forEach(b => b.classList.remove('disabled'));
    return;
  }
  const wheel = document.getElementById('rouletteWheel');
  rouletteRotation += 1440 + (data.number * 9.73);
  wheel.style.transform = `rotate(${rouletteRotation}deg)`;

  await new Promise(r => setTimeout(r, 2300));
  const net = data.payout - 5000;
  const emoji = { red: '🔴', black: '⚫', green: '🟢' }[data.color];
  const el = document.getElementById('rouletteResult');
  el.textContent = `Выпало ${data.number} ${emoji} — ` + (net > 0 ? `+${net} ${CUR}` : `${net} ${CUR}`);
  el.className = 'result-text ' + (net > 0 ? 'win' : 'lose');
  if (net > 0) fireConfetti();
  bumpBalance(data.balance);
  document.getElementById('rouletteChoices').querySelectorAll('.choice-btn').forEach(b => b.classList.remove('disabled'));
}

// ---------- Кости ----------
const DIE_FACES = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
function initDice() {
  const row = document.getElementById('diceChoices');
  row.innerHTML = '';
  for (let n = 1; n <= 6; n++) {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = n;
    btn.onclick = () => playDice(n);
    row.appendChild(btn);
  }
}
async function playDice(guess) {
  const die = document.getElementById('dieEl');
  die.classList.add('rolling');
  const data = await apiPost('/api/dice', { initData, stake: 2000, guess });
  await new Promise(r => setTimeout(r, 500));
  die.classList.remove('rolling');
  if (data.error) { showToast('Недостаточно сум'); return; }
  die.textContent = DIE_FACES[data.result];
  const net = data.payout - 2000;
  const el = document.getElementById('diceResult');
  el.textContent = `Выпало ${data.result} — ` + (net > 0 ? `+${net} ${CUR}` : `${net} ${CUR}`);
  el.className = 'result-text ' + (net > 0 ? 'win' : 'lose');
  if (net > 0) fireConfetti();
  bumpBalance(data.balance);
}

// ---------- Блэкджек ----------
function initBlackjack() {
  document.getElementById('bjStakeChoice').style.display = 'block';
  document.getElementById('bjGame').style.display = 'none';
  const row = document.getElementById('bjStakes');
  row.innerHTML = '';
  STAKES.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'stake-btn';
    btn.textContent = s;
    btn.onclick = () => bjStart(s);
    row.appendChild(btn);
  });
}
function cardChip(label) {
  const el = document.createElement('div');
  el.className = 'card-chip';
  el.textContent = label;
  return el;
}
async function bjStart(stake) {
  const data = await apiPost('/api/blackjack/start', { initData, stake });
  if (data.error) { showToast('Недостаточно сум'); return; }
  document.getElementById('bjStakeChoice').style.display = 'none';
  document.getElementById('bjGame').style.display = 'block';
  document.getElementById('bjResult').textContent = '';
  document.getElementById('bjActions').innerHTML =
    '<button class="choice-btn" onclick="bjHit()">➕ Ещё карту</button><button class="choice-btn" onclick="bjStand()">✋ Хватит</button>';
  renderBjState(data.player, [data.dealer_visible, '🂠'], data.player_value);
}
function renderBjState(player, dealer, playerValue) {
  const pRow = document.getElementById('bjPlayerCards');
  const dRow = document.getElementById('bjDealerCards');
  pRow.innerHTML = ''; dRow.innerHTML = '';
  player.forEach(c => pRow.appendChild(cardChip(c)));
  dealer.forEach(c => dRow.appendChild(cardChip(c)));
  document.getElementById('bjPlayerValue').textContent = playerValue !== undefined ? `Очки: ${playerValue}` : '';
}
async function bjHit() {
  const data = await apiPost('/api/blackjack/hit', { initData });
  if (data.finished) { bjFinish(data); return; }
  renderBjState(data.player, [data.dealer_visible, '🂠'], data.player_value);
}
async function bjStand() {
  const data = await apiPost('/api/blackjack/stand', { initData });
  bjFinish(data);
}
function bjFinish(data) {
  renderBjState(data.player, data.dealer, undefined);
  const messages = {
    bust: '💥 Перебор! Ты проиграл.',
    dealer_bust: `🎉 У дилера перебор! Выигрыш +${data.payout} ${CUR}`,
    win: `🎉 Ты выиграл!`,
    push: '🤝 Ничья, ставка возвращена.',
    lose: 'Ты проиграл.',
  };
  const el = document.getElementById('bjResult');
  el.textContent = messages[data.outcome] || '';
  const isWin = ['win', 'dealer_bust'].includes(data.outcome);
  el.className = 'result-text ' + (isWin ? 'win' : 'lose');
  if (isWin) fireConfetti();
  bumpBalance(data.balance);
  const btn = document.createElement('button');
  btn.className = 'choice-btn';
  btn.textContent = '🃏 Играть ещё';
  btn.onclick = initBlackjack;
  document.getElementById('bjActions').innerHTML = '';
  document.getElementById('bjActions').appendChild(btn);
}

// ---------- Mines ----------
let minesSelectedCount = 3;
let minesSelectedStake = 50;
function initMines() {
  document.getElementById('minesSetup').style.display = 'block';
  document.getElementById('minesGame').style.display = 'none';
  const countRow = document.getElementById('minesCountChoice');
  countRow.innerHTML = '';
  [1, 3, 5, 10].forEach(n => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn' + (n === minesSelectedCount ? '' : '');
    btn.style.opacity = n === minesSelectedCount ? '1' : '0.55';
    btn.textContent = `💣 ${n}`;
    btn.onclick = () => { minesSelectedCount = n; initMines(); };
    countRow.appendChild(btn);
  });
  const stakeRow = document.getElementById('minesStakes');
  stakeRow.innerHTML = '';
  STAKES.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'stake-btn';
    btn.textContent = s;
    btn.onclick = () => minesStart(s);
    stakeRow.appendChild(btn);
  });
}
async function minesStart(stake) {
  const data = await apiPost('/api/mines/start', { initData, stake, mines_count: minesSelectedCount });
  if (data.error) { showToast('Недостаточно сум'); return; }
  minesSelectedStake = stake;
  document.getElementById('minesSetup').style.display = 'none';
  document.getElementById('minesGame').style.display = 'block';
  document.getElementById('minesResult').textContent = '';
  document.getElementById('minesMultiplier').textContent = 'x1.00';
  document.getElementById('minesCashoutBtn').style.display = 'none';
  const grid = document.getElementById('minesGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 25; i++) {
    const tile = document.createElement('div');
    tile.className = 'mine-tile';
    tile.dataset.index = i;
    tile.onclick = () => minesReveal(i, tile);
    grid.appendChild(tile);
  }
}
async function minesReveal(idx, tileEl) {
  if (tileEl.classList.contains('revealed-safe') || tileEl.classList.contains('revealed-mine')) return;
  const data = await apiPost('/api/mines/reveal', { initData, tile_index: idx });
  if (data.error) return;
  if (data.busted) {
    tileEl.classList.add('revealed-mine');
    tileEl.textContent = '💣';
    data.mine_positions.forEach(i => {
      const t = document.querySelector(`.mine-tile[data-index="${i}"]`);
      if (t && !t.classList.contains('revealed-mine')) { t.classList.add('revealed-mine'); t.textContent = '💣'; }
    });
    document.getElementById('minesResult').textContent = '💥 Бум! Ты проиграл ставку.';
    document.getElementById('minesResult').className = 'result-text lose';
    document.getElementById('minesCashoutBtn').style.display = 'none';
    bumpBalance(data.balance);
    return;
  }
  tileEl.classList.add('revealed-safe');
  tileEl.textContent = '💎';
  document.getElementById('minesMultiplier').textContent = `x${data.multiplier.toFixed(2)}`;
  document.getElementById('minesCashoutBtn').style.display = 'inline-block';
  if (data.cleared_all) {
    document.getElementById('minesResult').textContent = `🎉 Поле зачищено! +${data.payout - minesSelectedStake} ${CUR}`;
    document.getElementById('minesResult').className = 'result-text win';
    document.getElementById('minesCashoutBtn').style.display = 'none';
    fireConfetti();
    bumpBalance(data.balance);
  }
}
async function minesCashout() {
  const data = await apiPost('/api/mines/cashout', { initData });
  if (data.error) return;
  document.getElementById('minesResult').textContent = `🎉 Забрано: +${data.payout - minesSelectedStake} ${CUR} (x${data.multiplier.toFixed(2)})`;
  document.getElementById('minesResult').className = 'result-text win';
  document.getElementById('minesCashoutBtn').style.display = 'none';
  document.querySelectorAll('.mine-tile').forEach(t => t.onclick = null);
  fireConfetti();
  bumpBalance(data.balance);
}

// ---------- Crash ----------
let crashPollTimer = null;
let crashSelectedStake = 50;
function initCrash() {
  document.getElementById('crashSetup').style.display = 'block';
  document.getElementById('crashGame').style.display = 'none';
  const row = document.getElementById('crashStakes');
  row.innerHTML = '';
  STAKES.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'stake-btn';
    btn.textContent = s;
    btn.onclick = () => crashStart(s);
    row.appendChild(btn);
  });
}
async function crashStart(stake) {
  const data = await apiPost('/api/crash/start', { initData, stake });
  if (data.error) { showToast('Недостаточно сум'); return; }
  crashSelectedStake = stake;
  document.getElementById('crashSetup').style.display = 'none';
  document.getElementById('crashGame').style.display = 'block';
  document.getElementById('crashResult').textContent = '';
  const label = document.getElementById('crashMultiplierLabel');
  label.textContent = 'x1.00';
  label.classList.remove('busted');
  document.getElementById('crashRocket').style.transform = 'translateY(0px)';
  document.getElementById('crashCashoutBtn').style.display = 'inline-block';
  document.getElementById('crashCashoutBtn').disabled = false;
  crashPollTimer = setInterval(crashPoll, 300);
}
async function crashPoll() {
  const data = await apiGet('/api/crash/status?initData=' + encodeURIComponent(initData));
  if (data.error) { stopCrashPolling(); return; }
  const label = document.getElementById('crashMultiplierLabel');
  label.textContent = `x${data.multiplier.toFixed(2)}`;
  const liftPx = Math.min(100, (data.multiplier - 1) * 20);
  document.getElementById('crashRocket').style.transform = `translateY(-${liftPx}px)`;
  if (data.crashed) {
    label.classList.add('busted');
    document.getElementById('crashRocket').textContent = '💥';
    document.getElementById('crashResult').textContent = `Лопнуло на x${data.multiplier.toFixed(2)}`;
    document.getElementById('crashResult').className = 'result-text lose';
    document.getElementById('crashCashoutBtn').style.display = 'none';
    stopCrashPolling();
  }
}
function stopCrashPolling() {
  if (crashPollTimer) { clearInterval(crashPollTimer); crashPollTimer = null; }
}
async function crashCashout() {
  document.getElementById('crashCashoutBtn').disabled = true;
  stopCrashPolling();
  const data = await apiPost('/api/crash/cashout', { initData });
  if (data.busted) {
    document.getElementById('crashResult').textContent = `Опоздал! Лопнуло на x${data.crash_point.toFixed(2)}`;
    document.getElementById('crashResult').className = 'result-text lose';
    bumpBalance(data.balance);
    return;
  }
  const net = data.payout - crashSelectedStake;
  document.getElementById('crashResult').textContent = `🎉 Забрано на x${data.multiplier.toFixed(2)}: +${net} ${CUR}`;
  document.getElementById('crashResult').className = 'result-text win';
  document.getElementById('crashCashoutBtn').style.display = 'none';
  document.getElementById('crashRocket').textContent = '🚀';
  fireConfetti();
  bumpBalance(data.balance);
}

// ---------- Таблица лидеров ----------
async function loadLeaderboard() {
  showScreen('leaderboard');
  const rows = await apiGet('/api/leaderboard');
  const list = document.getElementById('leaderboardList');
  list.innerHTML = rows.map((r, i) =>
    `<div class="leaderboard-item"><span><span class="rank">${i + 1}.</span>${r.username || 'аноним'}</span><span>${formatSum(r.balance)}</span></div>`
  ).join('');
}

// ---------- Инициализация ----------
initSlots();
initDice();
initBlackjack();
initMines();
initCrash();
refreshBalance();
</script>
